# Publishing a version: bump "version" in package.json, commit, then `git tag v0.2.0 && git push --tags`.
# This builds the app and publishes the GitHub release; installed apps pick it up within a few hours (lib/update.js).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest # Apple silicon
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 } # full history + tags, for the release notes
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      # Work lands on main without PRs, so --generate-notes would be empty: list the commits since the previous tag.
      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+$prev..}HEAD | grep -v '^- Release v' > notes.md || true
          cat notes.md
      # The .zip is what the in-app updater downloads; GitHub records its SHA-256 for the check.
      - run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*-mac.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
