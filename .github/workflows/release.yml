# Publishing a version: bump "version" in package.json, commit, then `git tag v0.2.0 && git push --tags`.
# This builds the app and publishes the GitHub release; installed apps pick it up within a few hours (lib/update.js).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest # Apple silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run dist -- --publish never
      # The .zip is what the in-app updater downloads; GitHub records its SHA-256 for the check.
      - run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*-mac.zip --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
